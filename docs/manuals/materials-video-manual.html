<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>คู่มือวิดีโอ Materials Management</title>
  <style>
    :root {
      --bg:#f5f7fb;--sidebar:#0f172a;--sidebar-soft:#17233a;
      --primary:#0f766e;--primary-hover:#115e59;--primary-soft:#ecfdf5;
      --text:#1f2937;--muted:#64748b;--border:#e5e7eb;--surface:#fff;
      --warning:#a16207;--warning-soft:#fefce8;--danger:#b91c1c;
      --danger-soft:#fef2f2;--info:#1d4ed8;--info-soft:#eff6ff;
      --shadow:0 14px 35px rgba(15,23,42,.08);--radius:16px;--sidebar-width:304px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;min-height:100dvh;color:var(--text);background:var(--bg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65}
    button,input{font:inherit}button{color:inherit}code,.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace;font-variant-numeric:tabular-nums}
    :focus-visible{outline:3px solid #2dd4bf;outline-offset:3px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip-link{position:fixed;inset-block-start:12px;inset-inline-start:12px;z-index:100;padding:10px 14px;border-radius:10px;color:#fff;background:var(--primary);transform:translateY(-150%)}
    .skip-link:focus{transform:translateY(0)}
    .app-shell{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100dvh}
    .sidebar{position:sticky;inset-block-start:0;z-index:30;display:flex;flex-direction:column;height:100dvh;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;color:#e2e8f0;background:linear-gradient(155deg,rgba(15,118,110,.19),transparent 32%),var(--sidebar);border-inline-end:1px solid rgba(255,255,255,.08)}
    .sidebar-head{padding:24px 20px 18px}.brand-row{display:flex;align-items:center;gap:12px}
    .brand-mark{display:grid;place-items:center;flex:0 0 42px;width:42px;aspect-ratio:1;border:1px solid rgba(94,234,212,.35);border-radius:12px;color:#99f6e4;background:rgba(15,118,110,.24);font-weight:800}
    .brand-copy{min-width:0}.brand-copy strong{display:block;color:#fff;font-size:15px;line-height:1.25}.brand-copy span{display:block;margin-block-start:2px;color:#94a3b8;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
    .sidebar-tools{padding:0 16px 14px}.search-wrap{position:relative;display:block}.search-icon{position:absolute;inset-block-start:50%;inset-inline-start:12px;width:16px;height:16px;color:#94a3b8;transform:translateY(-50%);pointer-events:none}
    .guide-search{width:100%;height:40px;padding:0 12px 0 38px;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#f8fafc;background:rgba(255,255,255,.07)}
    .guide-search::placeholder{color:#94a3b8}.episode-nav{padding:0 12px 18px}.episode-list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
    .episode-button{display:grid;grid-template-columns:30px minmax(0,1fr) 20px;align-items:center;gap:8px;width:100%;min-height:42px;padding:7px 9px;border:0;border-radius:10px;color:#cbd5e1;background:transparent;text-align:start;cursor:pointer}
    .episode-button:hover{background:rgba(255,255,255,.07)}.episode-button[aria-current="page"]{color:#fff;background:rgba(15,118,110,.34);box-shadow:inset 3px 0 #5eead4}
    .episode-number{color:#94a3b8;font-size:11px;letter-spacing:.05em}.episode-label{overflow:hidden;font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .episode-check{display:grid;place-items:center;width:18px;aspect-ratio:1;border:1px solid rgba(255,255,255,.16);border-radius:50%;color:transparent;font-size:11px}
    .episode-button.is-complete .episode-check{border-color:#5eead4;color:#052e2b;background:#5eead4}.empty-search{padding:18px 12px;color:#94a3b8;font-size:12px;text-align:center}
    .progress-panel{margin-block-start:auto;padding:16px;border-block-start:1px solid rgba(255,255,255,.09);background:rgba(2,6,23,.25)}
    .progress-label{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#cbd5e1;font-size:12px}.progress-label strong{color:#fff}
    .progress-track{height:7px;margin-block-start:9px;overflow:clip;border-radius:99px;background:rgba(255,255,255,.11)}.progress-bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14b8a6,#5eead4);transition:width .24s ease}
    .sidebar-toggle{display:none;width:100%;margin-block-start:12px;padding:8px;border:1px solid rgba(255,255,255,.12);border-radius:9px;color:#cbd5e1;background:transparent;cursor:pointer}
    .main-column{min-width:0}.topbar{position:sticky;inset-block-start:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px clamp(18px,4vw,54px);border-block-end:1px solid rgba(229,231,235,.9);background:rgba(255,255,255,.9);backdrop-filter:blur(14px)}
    .mobile-menu-button{display:none;place-items:center;width:40px;aspect-ratio:1;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer}
    .header-titles{min-width:0}.header-eyebrow{margin:0;color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.header-title{margin:1px 0 0;overflow:hidden;font-size:16px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .system-status{display:inline-flex;align-items:center;gap:7px;margin-inline-start:auto;padding:6px 10px;border:1px solid #a7f3d0;border-radius:999px;color:#065f46;background:var(--primary-soft);font-size:11px;font-weight:700;white-space:nowrap}
    .status-dot{width:7px;aspect-ratio:1;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.12)}
    .content{width:min(1120px,100%);margin-inline:auto;padding:30px clamp(18px,4vw,54px) 56px}.breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block-end:20px;color:var(--muted);font-size:12px}.breadcrumb strong{color:var(--text)}.breadcrumb-sep{color:#cbd5e1}
    .episode-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-block-end:24px}.episode-kicker{margin:0 0 8px;color:var(--primary);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .episode-heading{margin:0;color:#111827;font-size:clamp(28px,4vw,44px);line-height:1.12;letter-spacing:-.035em;text-wrap:balance}.episode-summary{max-width:760px;margin:12px 0 0;color:var(--muted);font-size:15px}
    .path-badges{display:flex;flex-wrap:wrap;gap:7px;margin-block-start:14px}.path-badge{padding:5px 9px;border:1px solid #cbd5e1;border-radius:8px;color:#334155;background:rgba(255,255,255,.7);font-size:11px}
    .complete-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--primary);border-radius:10px;color:#fff;background:var(--primary);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .complete-button:hover{background:var(--primary-hover)}.complete-button.is-complete{border-color:#a7f3d0;color:#065f46;background:var(--primary-soft)}
    .material-flow{display:grid;grid-template-columns:repeat(5,1fr);margin-block-end:24px;overflow:clip;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:0 7px 24px rgba(15,23,42,.045)}
    .flow-step{position:relative;padding:12px 10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em;text-align:center;text-transform:uppercase}.flow-step+.flow-step{border-inline-start:1px solid var(--border)}
    .flow-step.is-active{color:#065f46;background:var(--primary-soft)}.flow-step.is-active::after{content:"";position:absolute;inset-inline:18px;inset-block-end:0;height:3px;border-radius:99px 99px 0 0;background:var(--primary)}
    .video-card{overflow:clip;margin-block-end:24px;border:1px solid #1e293b;border-radius:var(--radius);background:#020617;box-shadow:var(--shadow)}.video-stage{display:grid;place-items:center;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at 20% 20%,rgba(20,184,166,.18),transparent 30%),linear-gradient(135deg,#111827,#020617)}
    .video-stage video,.video-stage iframe{display:block;width:100%;height:100%;border:0;object-fit:contain}.video-placeholder{display:grid;place-items:center;width:min(440px,78%);aspect-ratio:16/7;border:1px dashed rgba(153,246,228,.45);border-radius:14px;color:#ccfbf1;background:rgba(15,118,110,.12);text-align:center}
    .video-placeholder strong{display:block;font-size:clamp(18px,3vw,28px);letter-spacing:-.02em}.video-placeholder span{display:block;margin-block-start:5px;color:#94a3b8;font-size:12px}
    .video-meta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;color:#94a3b8;background:#0f172a;font-size:11px}.video-meta strong{color:#e2e8f0}
    .section-stack{display:grid;gap:18px}.doc-card{padding:clamp(18px,3vw,26px);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:0 8px 25px rgba(15,23,42,.045)}
    .doc-card h2{margin:0 0 14px;color:#111827;font-size:18px;line-height:1.35}.doc-card h3{margin:18px 0 8px;font-size:14px}.doc-card p{margin:0}.doc-card p+p{margin-block-start:10px}
    .narration{position:relative;padding-inline-start:20px;border-inline-start:4px solid var(--primary);color:#334155;font-size:15px;font-style:italic}.narration::before{content:"“";position:absolute;inset-block-start:-18px;inset-inline-start:8px;color:rgba(15,118,110,.16);font-size:62px;font-style:normal;line-height:1}
    .fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}.fact{min-width:0;padding:15px;border:1px solid var(--border);border-radius:12px;background:#fbfcfe}.fact small{display:block;margin-block-end:5px;color:var(--primary);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.fact strong{display:block;color:#1e293b;font-size:14px}.fact p{margin-block-start:5px;color:var(--muted);font-size:12px}
    .step-list{display:grid;gap:0;margin:0;padding:0;list-style:none;counter-reset:manual-step}.step-list li{position:relative;min-height:48px;padding:4px 0 18px 48px;counter-increment:manual-step}.step-list li:not(:last-child)::after{content:"";position:absolute;inset-block-start:33px;inset-block-end:-1px;inset-inline-start:16px;width:1px;background:#cbd5e1}
    .step-list li::before{content:counter(manual-step,decimal-leading-zero);position:absolute;inset-block-start:0;inset-inline-start:0;display:grid;place-items:center;width:33px;aspect-ratio:1;border:1px solid #99f6e4;border-radius:9px;color:#0f766e;background:var(--primary-soft);font:700 11px/1 Consolas,monospace}.step-list strong{font-size:14px}.step-list p{margin-block-start:3px;color:var(--muted);font-size:12px}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;scrollbar-gutter:stable}.doc-table{width:100%;min-width:620px;border-collapse:collapse;font-size:12px}.doc-table caption{padding:10px 12px;color:var(--muted);background:#f8fafc;text-align:start}.doc-table th,.doc-table td{padding:10px 12px;border-block-end:1px solid var(--border);text-align:start;vertical-align:top}.doc-table th{color:#475569;background:#f8fafc;font-weight:700;white-space:nowrap}.doc-table tr:last-child td{border-block-end:0}.doc-table td:first-child{color:#334155;font-weight:700}
    .callout{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:16px;border:1px solid;border-radius:12px;font-size:13px}.callout-icon{display:grid;place-items:center;width:28px;aspect-ratio:1;border-radius:8px;font-weight:800}.callout strong{display:block;margin-block-end:3px}.callout.info{border-color:#bfdbfe;color:#1e3a8a;background:var(--info-soft)}.callout.info .callout-icon{color:#fff;background:var(--info)}.callout.warning{border-color:#fde68a;color:#713f12;background:var(--warning-soft)}.callout.warning .callout-icon{color:#fff;background:var(--warning)}.callout.missing{border-color:#fecaca;color:#7f1d1d;background:var(--danger-soft)}.callout.missing .callout-icon{color:#fff;background:var(--danger)}
    .formula{display:grid;gap:10px;padding:18px;border:1px solid #99f6e4;border-radius:12px;background:linear-gradient(135deg,#f0fdfa,#ecfdf5)}.formula-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;color:#115e59;font-family:Consolas,"Cascadia Mono",monospace;font-size:clamp(14px,2vw,18px);font-weight:700}.formula small{color:#0f766e;font:600 11px/1.4 "Segoe UI",sans-serif}
    .timeline{display:grid;gap:10px;margin:0;padding:0;list-style:none}.timeline li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fbfcfe}.timeline-index{display:grid;place-items:center;width:36px;aspect-ratio:1;border-radius:10px;color:#fff;background:var(--sidebar);font:800 11px/1 Consolas,monospace}.timeline strong{display:block;font-size:13px}.timeline p{margin-block-start:3px;color:var(--muted);font-size:12px}
    .expected{border-color:#a7f3d0;background:linear-gradient(135deg,#fff,#f0fdfa)}.expected h2{color:#065f46}.source-list{margin:0;padding-inline-start:18px;color:var(--muted);font-size:11px}.source-list li+li{margin-block-start:5px}.source-list code{color:#334155;overflow-wrap:anywhere}
    .checklist-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.checklist-group{padding:16px;border:1px solid var(--border);border-radius:12px;background:#fbfcfe}.checklist-group h3{margin:0 0 10px}.checklist-items{display:grid;gap:7px}.check-item{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer}.check-item:hover{background:var(--primary-soft)}.check-item input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--primary)}.check-item span{font-size:13px}
    .episode-footer{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-block-start:24px;padding-block-start:20px;border-block-start:1px solid var(--border)}.nav-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border:1px solid var(--border);border-radius:10px;color:#334155;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer}.nav-button.next{justify-self:end}.nav-button:disabled{opacity:.42;cursor:not-allowed}.episode-position{color:var(--muted);font-size:11px}
    .sidebar-backdrop{position:fixed;inset:0;z-index:25;display:none;border:0;background:rgba(2,6,23,.58);cursor:pointer}
    @media(max-width:1080px) and (min-width:761px){.app-shell{grid-template-columns:88px minmax(0,1fr)}.sidebar{width:88px}.sidebar-head{padding-inline:18px}.brand-copy,.sidebar-tools,.episode-label,.progress-label span:first-child{display:none}.episode-button{grid-template-columns:30px 20px;justify-content:center}.episode-nav{padding-inline:10px}.progress-panel{padding-inline:12px}.sidebar-toggle{display:block}body.sidebar-expanded-tablet .app-shell{grid-template-columns:var(--sidebar-width) minmax(0,1fr)}body.sidebar-expanded-tablet .sidebar{width:var(--sidebar-width)}body.sidebar-expanded-tablet .brand-copy,body.sidebar-expanded-tablet .sidebar-tools,body.sidebar-expanded-tablet .episode-label,body.sidebar-expanded-tablet .progress-label span:first-child{display:block}body.sidebar-expanded-tablet .episode-button{grid-template-columns:30px minmax(0,1fr) 20px;justify-content:initial}}
    @media(max-width:760px){.app-shell{display:block}.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:min(330px,86%);transform:translateX(-105%);transition:transform .22s ease}body.sidebar-open{overflow:hidden}body.sidebar-open .sidebar{transform:translateX(0)}body.sidebar-open .sidebar-backdrop{display:block}.mobile-menu-button{display:grid}.topbar{padding-inline:14px}.system-status{display:none}.content{padding-block-start:22px}.episode-hero{grid-template-columns:1fr;gap:16px}.complete-button{justify-self:start}.material-flow{grid-template-columns:1fr}.flow-step+.flow-step{border-inline-start:0;border-block-start:1px solid var(--border)}.flow-step.is-active::after{inset-inline:0 auto;inset-block:8px;width:3px;height:auto;border-radius:0 99px 99px 0}.video-meta{align-items:flex-start;flex-direction:column;gap:3px}.checklist-columns{grid-template-columns:1fr}.episode-footer{grid-template-columns:1fr 1fr}.episode-position{grid-column:1/-1;grid-row:1;text-align:center}.nav-button{grid-row:2}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
    @media print{.sidebar,.topbar,.sidebar-backdrop,.complete-button,.episode-footer{display:none!important}.app-shell{display:block}.content{width:100%;padding:0}.doc-card,.video-card{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <a class="skip-link" href="#manual-content">ข้ามไปยังเนื้อหาคู่มือ</a>
  <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="ปิดเมนูคู่มือ"></button>
  <div class="app-shell">
    <aside class="sidebar" id="manual-sidebar" aria-label="สารบัญคู่มือ Materials">
      <div class="sidebar-head"><div class="brand-row"><div class="brand-mark" aria-hidden="true">M</div><div class="brand-copy"><strong>Materials Manual</strong><span>Warehouse operations</span></div></div></div>
      <div class="sidebar-tools">
        <label class="search-wrap"><span class="sr-only">ค้นหาหัวข้อคู่มือ</span>
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input class="guide-search" id="guide-search" type="search" placeholder="ค้นหาหัวข้อคู่มือ..." autocomplete="off">
        </label>
      </div>
      <nav class="episode-nav" aria-label="ตอนของคู่มือ"><ol class="episode-list" id="episode-list"></ol><p class="empty-search" id="empty-search" hidden>ไม่พบตอนที่ตรงกับคำค้น</p></nav>
      <div class="progress-panel">
        <div class="progress-label"><span>ความคืบหน้า</span><strong id="progress-text">0 / 13 ตอน · 0%</strong></div>
        <div class="progress-track" role="progressbar" aria-label="ความคืบหน้าการดูคู่มือ" aria-valuemin="0" aria-valuemax="13" aria-valuenow="0"><div class="progress-bar" id="progress-bar"></div></div>
        <button class="sidebar-toggle" id="tablet-toggle" type="button" aria-expanded="false">ขยาย / ย่อ Sidebar</button>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="เปิดเมนูคู่มือ" aria-controls="manual-sidebar" aria-expanded="false"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
        <div class="header-titles"><p class="header-eyebrow">คู่มือวิดีโอภายในองค์กร</p><p class="header-title" id="header-title">ภาพรวม Materials</p></div>
        <span class="system-status"><span class="status-dot" aria-hidden="true"></span>อ้างอิงระบบจริง · 27 ก.ย. 2026</span>
      </header>
      <main class="content" id="manual-content" tabindex="-1">
        <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></div>
        <article id="episode-content" aria-live="polite"></article>
      </main>
    </div>
  </div>
  <script>
    "use strict";

    /*
      VIDEO CONFIGURATION
      Local MP4:  { type: "mp4", src: "./videos/material-create.mp4" }
      Local WebM: { type: "webm", src: "./videos/create.webm" } — สร้างจริงด้วย
                  `node scripts/record-materials-guide.mjs <episode>` (Playwright บันทึกวิดีโอ
                  จากแอปจริงที่ localhost:3000 โดยตรง ไม่มี CDN, ไม่มีเสียง)
      YouTube:    { type: "youtube", src: "VIDEO_ID" }
      ค่าเริ่มต้นเป็น placeholder เพื่อให้ไฟล์เปิด offline ได้ทันทีสำหรับตอนที่ยังไม่ได้อัด
    */
    const videoConfig = {
      overview:{type:"webm",src:"./videos/overview.webm"},read:{type:"webm",src:"./videos/read.webm"},
      create:{type:"webm",src:"./videos/create.webm"},detail:{type:"webm",src:"./videos/detail.webm"},
      update:{type:"webm",src:"./videos/update.webm"},deactivate:{type:"webm",src:"./videos/deactivate.webm"},
      validation:{type:"webm",src:"./videos/validation.webm"},receiving:{type:"webm",src:"./videos/receiving.webm"},
      disbursement:{type:"webm",src:"./videos/disbursement.webm"},bom:{type:"webm",src:"./videos/bom.webm"},
      stock:{type:"webm",src:"./videos/stock.webm"},endToEnd:{type:"placeholder",src:""},
      checklist:{type:"placeholder",src:""}
    };

    const episodes = [
      {
        id:"overview",number:1,title:"ภาพรวม Materials",shortTitle:"Overview",

            ["Traceability","เปิด Material Report ตรวจ Lot, QR และ Movement"],
            ["Inactive","Soft Deactivate แล้วค้นหาจาก Inactive view"],
            ["Cleanup","Restore หรือคง Inactive ตามแผน; เอกสาร Confirmed ต้องรักษาไว้"]
          ]},
          {type:"callout",tone:"warning",title:"ใช้ค่าปัจจุบันให้สอดคล้องกัน",text:"หาก Update Packing Quantity จาก 20 เป็น 25 ก่อน Receiving ตัวอย่าง 40 หน่วยจะแบ่งเป็น 25 + 15 ไม่ใช่ 20 + 20"},
          {type:"callout",tone:"info",title:"จุดหยุดที่ถูกต้อง",text:"ถ้า environment ไม่มี Product/BOM/Production Plan ทดสอบ ห้ามอ้างว่าทำสำเร็จ ให้พูดว่า Feature มีในระบบแต่ยังไม่มี Test Data แล้วข้ามไป Stock/Traceability"},
          {type:"callout",tone:"missing",title:"วิดีโอตอนนี้ยังเป็น Placeholder",text:"ffmpeg ที่มากับ Playwright ในเครื่องที่ใช้อัด (scripts/record-materials-guide.mjs) ไม่มี concat demuxer จึงต่อ 10 คลิปของตอนที่ 1-11 เป็นไฟล์เดียวไม่ได้โดยไม่ติดตั้ง ffmpeg แบบเต็มเพิ่ม ระหว่างนี้ให้ดู flow ต่อเนื่องได้จากวิดีโอจริงของแต่ละตอนที่ 1-11 แทน"}
        ],
        expected:"ได้วิดีโอหนึ่งตอนที่เล่า flow จริงต่อเนื่อง ไม่สับสน route ไม่ทำลายประวัติ และไม่เปิดเผยข้อมูล Production",
        sources:["src/app/(dashboard)/materials/pc/page.tsx","src/lib/api/materials-receiving.ts","src/lib/api/materials-disbursement.ts","src/lib/api/boms.ts","src/lib/api/material-job-orders.ts"]
      },
      {
        id:"checklist",number:13,title:"Checklist",shortTitle:"Checklist",
        path:["localStorage"],stage:"all",
        keywords:"checklist before after recording backend frontend database sensitive cleanup console",
        summary:"Checklist แบบกดใช้งานได้จริง บันทึกสถานะใน localStorage และคงอยู่หลัง Refresh",
        narration:"ก่อนอัดให้ตรวจ environment, permission, master data และ API หลังอัดให้ตรวจความครบถ้วน URL, console, ข้อมูล sensitive และ cleanup ทุกช่องจะถูกเก็บใน browser เครื่องนี้",
        blocks:[
          {type:"checklist",title:"Checklist การอัดวิดีโอ"},
          {type:"callout",tone:"warning",title:"ขอบเขตข้อมูล",text:"อย่าให้ Access Token, Cookie, Password, User ID จริง, Supplier contract, PO จริง หรือข้อมูล Production ที่อ่อนไหวปรากฏในหน้าจอ DevTools URL หรือชื่อไฟล์วิดีโอ"},
          {type:"callout",tone:"info",title:"ตอนนี้ไม่มีวิดีโอ",text:"Checklist เป็นฟีเจอร์ฝั่ง client ล้วนๆ (เก็บสถานะใน localStorage) ไม่มี workflow ของระบบจริงให้สาธิตเพิ่มเติมนอกเหนือจากการติ๊กช่อง จึงไม่ได้อัดวิดีโอแยกสำหรับตอนนี้"}
        ],
        expected:"ทีมอัดคลิปใช้ Checklist ชุดเดียวกันได้ และสถานะยังอยู่หลัง Refresh หน้า HTML",
        sources:["docs/manuals/materials-video-manual.html"]
      }
    ];

    const checklistGroups = [
      {title:"ก่อนอัดคลิป",items:["Backend Running","Frontend Running","Database Connected","Master Data พร้อม","Login ได้","Test Data พร้อม","Receiving API พร้อม","Disbursement API พร้อม","BOM API พร้อม","Stock API พร้อม"]},
      {title:"หลังอัดคลิป",items:["CRUD ครบ","Validation ครบ","URL ถูกต้อง","ไม่มี Console Error","ไม่มีข้อมูล Sensitive","Cleanup Test Data แล้ว"]}
    ];
    const flowStages=[["master","01 · Material Master"],["receive","02 · Receiving"],["stock","03 · Stock"],["issue","04 · Issue"],["bom","05 · BOM / Production"]];
    const storageKeys={completed:"materials-video-manual:completed:v1",checklist:"materials-video-manual:checklist:v1"};

    function readStorage(key,fallback){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch(error){return fallback}}
    function writeStorage(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(error){}}
    function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

    let completed=new Set(readStorage(storageKeys.completed,[]));
    let checklistState=readStorage(storageKeys.checklist,{});
    let currentIndex=Math.max(0,episodes.findIndex(function(episode){return "#"+episode.id===location.hash}));
    const episodeList=document.getElementById("episode-list");
    const episodeContent=document.getElementById("episode-content");
    const guideSearch=document.getElementById("guide-search");
    const emptySearch=document.getElementById("empty-search");
    const progressText=document.getElementById("progress-text");
    const progressBar=document.getElementById("progress-bar");
    const progressTrack=document.querySelector(".progress-track");
    const headerTitle=document.getElementById("header-title");
    const breadcrumb=document.getElementById("breadcrumb");
    const mobileMenuButton=document.getElementById("mobile-menu-button");
    const sidebarBackdrop=document.getElementById("sidebar-backdrop");
    const tabletToggle=document.getElementById("tablet-toggle");
    const manualSidebar=document.getElementById("manual-sidebar");
    const mainColumn=document.querySelector(".main-column");

    function renderSidebar(filter){
      const query=(filter||"").trim().toLocaleLowerCase("th");
      const visible=episodes.filter(function(episode){return !query||(episode.title+" "+episode.shortTitle+" "+episode.keywords+" "+episode.path.join(" ")).toLocaleLowerCase("th").includes(query)});
      episodeList.innerHTML=visible.map(function(episode){
        const active=episodes[currentIndex].id===episode.id,done=completed.has(episode.id);
        return '<li><button type="button" class="episode-button'+(done?' is-complete':'')+'" data-episode-id="'+escapeHtml(episode.id)+'"'+(active?' aria-current="page"':'')+' aria-label="ตอนที่ '+episode.number+' '+escapeHtml(episode.title)+(done?' ดูแล้ว':'')+'"><span class="episode-number">'+String(episode.number).padStart(2,"0")+'</span><span class="episode-label">'+escapeHtml(episode.title)+'</span><span class="episode-check" aria-hidden="true">✓</span></button></li>'
      }).join("");
      emptySearch.hidden=visible.length!==0;
      episodeList.querySelectorAll("[data-episode-id]").forEach(function(button){button.addEventListener("click",function(){const index=episodes.findIndex(function(episode){return episode.id===button.dataset.episodeId});if(index>=0)showEpisode(index,true)})})
    }
    function renderFlow(stage){return '<div class="material-flow" aria-label="เส้นทาง Material ในระบบ">'+flowStages.map(function(item){const active=stage==="all"||stage===item[0];return '<div class="flow-step'+(active?' is-active':'')+'">'+escapeHtml(item[1])+'</div>'}).join("")+'</div>'}
    function renderVideo(episode){
      const config=videoConfig[episode.id]||{type:"placeholder",src:""};let media="";
      if(config.type==="mp4"&&config.src){media='<video controls preload="metadata"><source src="'+escapeHtml(config.src)+'" type="video/mp4">Browser นี้ไม่รองรับวิดีโอ HTML5</video>'}
      else if(config.type==="webm"&&config.src){media='<video controls preload="metadata"><source src="'+escapeHtml(config.src)+'" type="video/webm">Browser นี้ไม่รองรับวิดีโอ HTML5 — เปิดด้วย Chrome, Edge หรือ Firefox</video>'}
      else if(config.type==="youtube"&&config.src){const videoId=config.src.replace(/^.*(?:youtu\.be\/|v=|embed\/)/,"").split(/[?&]/)[0];media='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(videoId)+'" title="วิดีโอ ตอนที่ '+episode.number+' '+escapeHtml(episode.title)+'" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'}
      else{media='<div class="video-placeholder"><div><strong>Video Episode '+String(episode.number).padStart(2,"0")+'</strong><span>'+escapeHtml(episode.title)+' · พร้อมใส่วิดีโอจริง</span></div></div>'}
      return '<section class="video-card" aria-label="วิดีโอประจำตอน"><div class="video-stage">'+media+'</div><div class="video-meta"><strong>ตอนที่ '+String(episode.number).padStart(2,"0")+' · '+escapeHtml(episode.title)+'</strong><span>16:9 · '+escapeHtml(config.type==="placeholder"?"Placeholder":config.type.toUpperCase())+'</span></div></section>'
    }
    function renderBlock(block){
      if(block.type==="facts")return '<section class="doc-card"><h2>'+escapeHtml(block.title)+'</h2><div class="fact-grid">'+block.items.map(function(item){return '<div class="fact"><small>'+escapeHtml(item[0])+'</small><strong>'+escapeHtml(item[1])+'</strong><p>'+escapeHtml(item[2])+'</p></div>'}).join("")+'</div></section>';
      if(block.type==="steps")return '<section class="doc-card"><h2>'+escapeHtml(block.title)+'</h2><ol class="step-list">'+block.items.map(function(item){return '<li><strong>'+escapeHtml(item[0])+'</strong><p>'+escapeHtml(item[1])+'</p></li>'}).join("")+'</ol></section>';
      if(block.type==="table")return '<section class="doc-card"><h2>'+escapeHtml(block.title)+'</h2><div class="table-wrap"><table class="doc-table"><caption>'+escapeHtml(block.caption)+'</caption><thead><tr>'+block.headers.map(function(header){return '<th scope="col">'+escapeHtml(header)+'</th>'}).join("")+'</tr></thead><tbody>'+block.rows.map(function(row){return '<tr>'+row.map(function(cell){return '<td>'+escapeHtml(cell)+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></section>';
      if(block.type==="callout"){const symbol=block.tone==="missing"?"!":block.tone==="warning"?"△":"i";return '<aside class="callout '+escapeHtml(block.tone)+'"><span class="callout-icon" aria-hidden="true">'+symbol+'</span><div><strong>'+escapeHtml(block.title)+'</strong><span>'+escapeHtml(block.text)+'</span></div></aside>'}
      if(block.type==="formula")return '<section class="doc-card"><h2>'+escapeHtml(block.title)+'</h2><div class="formula">'+block.lines.map(function(line){return '<div class="formula-line"><small>'+escapeHtml(line[0])+'</small><span>'+escapeHtml(line[1])+'</span></div>'}).join("")+'</div></section>';
      if(block.type==="timeline")return '<section class="doc-card"><h2>'+escapeHtml(block.title)+'</h2><ol class="timeline">'+block.items.map(function(item,index){return '<li><span class="timeline-index">'+String(index+1).padStart(2,"0")+'</span><div><strong>'+escapeHtml(item[0])+'</strong><p>'+escapeHtml(item[1])+'</p></div></li>'}).join("")+'</ol></section>';
      if(block.type==="checklist")return renderChecklist(block.title);
      return ""
    }
    function renderChecklist(title){return '<section class="doc-card"><h2>'+escapeHtml(title)+'</h2><div class="checklist-columns">'+checklistGroups.map(function(group,groupIndex){return '<div class="checklist-group"><h3>'+escapeHtml(group.title)+'</h3><div class="checklist-items">'+group.items.map(function(item,itemIndex){const key=groupIndex+":"+itemIndex;return '<label class="check-item"><input type="checkbox" data-check-key="'+key+'"'+(checklistState[key]?' checked':'')+'><span>'+escapeHtml(item)+'</span></label>'}).join("")+'</div></div>'}).join("")+'</div></section>'}
    function bindChecklist(){episodeContent.querySelectorAll("[data-check-key]").forEach(function(input){input.addEventListener("change",function(){checklistState[input.dataset.checkKey]=input.checked;writeStorage(storageKeys.checklist,checklistState)})})}
    function renderSources(list){return '<section class="doc-card"><h2>ตรวจสอบกับ Source Code</h2><ul class="source-list">'+list.map(function(source){return '<li><code>'+escapeHtml(source)+'</code></li>'}).join("")+'</ul></section>'}
    function showEpisode(index,scrollToTop){
      currentIndex=Math.max(0,Math.min(index,episodes.length-1));const episode=episodes[currentIndex],isComplete=completed.has(episode.id);
      headerTitle.textContent=episode.title;document.title="ตอนที่ "+episode.number+" · "+episode.title+" | Materials Manual";history.replaceState(null,"","#"+episode.id);
      breadcrumb.innerHTML='<span>คู่มือระบบ</span><span class="breadcrumb-sep" aria-hidden="true">›</span><span>Materials</span><span class="breadcrumb-sep" aria-hidden="true">›</span><strong>'+escapeHtml(episode.title)+'</strong>';
      episodeContent.innerHTML='<header class="episode-hero"><div><p class="episode-kicker">ตอนที่ '+String(episode.number).padStart(2,"0")+' · '+escapeHtml(episode.shortTitle)+'</p><h1 class="episode-heading">'+escapeHtml(episode.title)+'</h1><p class="episode-summary">'+escapeHtml(episode.summary)+'</p><div class="path-badges">'+episode.path.map(function(path){return '<code class="path-badge">'+escapeHtml(path)+'</code>'}).join("")+'</div></div><button type="button" class="complete-button'+(isComplete?' is-complete':'')+'" id="complete-button">'+(isComplete?'✓ ดูตอนนี้แล้ว':'ทำเครื่องหมายว่าดูแล้ว')+'</button></header>'+renderFlow(episode.stage)+renderVideo(episode)+'<div class="section-stack"><section class="doc-card"><h2>คำพูดผู้บรรยาย</h2><p class="narration">'+escapeHtml(episode.narration)+'</p></section>'+episode.blocks.map(renderBlock).join("")+'<section class="doc-card expected"><h2>Expected Result</h2><p>'+escapeHtml(episode.expected)+'</p></section>'+renderSources(episode.sources)+'</div><footer class="episode-footer"><button class="nav-button prev" type="button"'+(currentIndex===0?' disabled':'')+'>← ตอนก่อนหน้า</button><span class="episode-position">'+(currentIndex+1)+' / '+episodes.length+'</span><button class="nav-button next" type="button"'+(currentIndex===episodes.length-1?' disabled':'')+'>ตอนถัดไป →</button></footer>';
      document.getElementById("complete-button").addEventListener("click",toggleCurrentComplete);
      episodeContent.querySelector(".prev").addEventListener("click",function(){showEpisode(currentIndex-1,true)});
      episodeContent.querySelector(".next").addEventListener("click",function(){showEpisode(currentIndex+1,true)});
      bindChecklist();renderSidebar(guideSearch.value);updateProgress();closeMobileSidebar();
      if(scrollToTop){document.getElementById("manual-content").scrollIntoView({block:"start"});document.getElementById("manual-content").focus({preventScroll:true})}
    }
    function toggleCurrentComplete(){const id=episodes[currentIndex].id;if(completed.has(id))completed.delete(id);else completed.add(id);writeStorage(storageKeys.completed,Array.from(completed));showEpisode(currentIndex,false)}
    function updateProgress(){const count=episodes.filter(function(episode){return completed.has(episode.id)}).length,percent=Math.round(count/episodes.length*100);progressText.textContent=count+" / "+episodes.length+" ตอน · "+percent+"%";progressBar.style.width=percent+"%";progressTrack.setAttribute("aria-valuenow",String(count));progressTrack.setAttribute("aria-valuemax",String(episodes.length))}
    function syncSidebarAccessibility(){const mobile=window.innerWidth<=760,open=document.body.classList.contains("sidebar-open");manualSidebar.inert=mobile&&!open;mainColumn.inert=mobile&&open}
    function openMobileSidebar(){document.body.classList.add("sidebar-open");mobileMenuButton.setAttribute("aria-expanded","true");syncSidebarAccessibility();const firstButton=episodeList.querySelector("button");if(firstButton)firstButton.focus()}
    function closeMobileSidebar(){const wasOpen=document.body.classList.contains("sidebar-open");document.body.classList.remove("sidebar-open");mobileMenuButton.setAttribute("aria-expanded","false");syncSidebarAccessibility();if(wasOpen&&window.innerWidth<=760)mobileMenuButton.focus()}

    guideSearch.addEventListener("input",function(){renderSidebar(guideSearch.value)});
    mobileMenuButton.addEventListener("click",openMobileSidebar);
    sidebarBackdrop.addEventListener("click",closeMobileSidebar);
    tabletToggle.addEventListener("click",function(){const expanded=document.body.classList.toggle("sidebar-expanded-tablet");tabletToggle.setAttribute("aria-expanded",String(expanded))});
    document.addEventListener("keydown",function(event){if(event.key==="Escape"&&document.body.classList.contains("sidebar-open"))closeMobileSidebar()});
    window.addEventListener("hashchange",function(){const index=episodes.findIndex(function(episode){return "#"+episode.id===location.hash});if(index>=0&&index!==currentIndex)showEpisode(index,true)});
    window.addEventListener("resize",syncSidebarAccessibility);
    showEpisode(currentIndex,false);
  </script>
</body>
</html>
